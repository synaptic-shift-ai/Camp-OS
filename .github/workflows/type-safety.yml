name: Type Safety & Contracts Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Phase 1b: Schema drift detection (placeholder for now)
      # Uncomment when SUPABASE_PROJECT_ID is configured:
      # - name: Generate DB types
      #   env:
      #     SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      #     SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      #   run: npm run gen:db
      #
      # - name: Check for schema drift
      #   run: |
      #     git diff --exit-code src/contracts/db.ts || \
      #     (echo "❌ DB schema has drifted! Run 'npm run gen:db' locally and commit." && exit 1)

      - name: TypeScript type check
        run: npm run type-check

      # TODO: Re-enable lint after fixing ESLint config for Next.js 16
      # - name: Lint check
      #   run: npm run lint

      - name: Build check
        run: npm run build

      # Phase 1c: Check for SDK imports in UI layer
      - name: Check layering violations (SDK imports in app/)
        run: |
          echo "Checking for SDK imports in app/ (excluding api/ and actions/)..."

          # Check for @supabase imports in UI components
          SUPABASE_VIOLATIONS=$(grep -r "from.*@supabase" app/ components/ --include="*.tsx" --include="*.ts" | grep -v "app/api/" | grep -v "app/.*actions/" || true)

          # Check for stripe imports in UI components
          STRIPE_VIOLATIONS=$(grep -r "from.*stripe" app/ components/ --include="*.tsx" --include="*.ts" | grep -v "app/api/" | grep -v "app/.*actions/" || true)

          if [ ! -z "$SUPABASE_VIOLATIONS" ]; then
            echo "❌ Found @supabase imports in UI layer:"
            echo "$SUPABASE_VIOLATIONS"
            exit 1
          fi

          if [ ! -z "$STRIPE_VIOLATIONS" ]; then
            echo "❌ Found stripe imports in UI layer:"
            echo "$STRIPE_VIOLATIONS"
            exit 1
          fi

          echo "✅ No SDK imports found in UI layer"

      # Phase 1: Check for local type definitions
      - name: Check for local types (should use @/contracts/*)
        run: |
          echo "Checking for local types.ts files in app/ and components/..."

          LOCAL_TYPES=$(find app/ components/ -name "types.ts" -o -name "types.tsx" 2>/dev/null || true)

          if [ ! -z "$LOCAL_TYPES" ]; then
            echo "⚠️  Found local type files (prefer @/contracts/*):"
            echo "$LOCAL_TYPES"
            echo ""
            echo "Consider moving types to src/contracts/ for better maintainability"
            # Not failing build yet, just warning
          else
            echo "✅ No local type files found"
          fi

  contracts-protection:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for contracts changes
        id: contracts-changed
        run: |
          # Check if any files in src/contracts/ were modified
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep "^src/contracts/" || true)

          if [ ! -z "$CHANGED" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "⚠️  Contracts files modified:"
            echo "$CHANGED"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Require contracts review
        if: steps.contracts-changed.outputs.changed == 'true'
        run: |
          echo "⚠️  This PR modifies contracts in src/contracts/"
          echo "Requires tech lead review before merge"
          echo ""
          echo "Modified files:"
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep "^src/contracts/"
