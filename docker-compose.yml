services:
  app:
    container_name: campos
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - .env
    command: sh -c "npm install && npm run dev"
    networks:
      - shared_network

volumes:
  node_modules:


networks:
  shared_network:
    external: true